<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>광덕 안전지도</title>
  <meta name="description" content="광덕중·고등학교 캠퍼스 평면도 기반 안전 신고 지도" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 30c-1-4-10-9-10-17a10 10 0 0 1 20 0c0 8-9 13-10 17z' fill='%23dc2626'/%3E%3Ccircle cx='16' cy='13' r='4' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M16 30c-1-4-10-9-10-17a10 10 0 0 1 20 0c0 8-9 13-10 17z" /><circle cx="16" cy="13" r="4" /></svg>
      </span>
      <span class="brand-text">
        <strong>광덕 안전지도</strong>
        <small>광덕중·고등학교 안전신문고</small>
      </span>
    </a>
    <div class="topbar-actions">
      <button id="btnReport" class="btn btn-danger" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span>위험 신고</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" aria-label="평면도">
      <svg id="map" class="map" role="application" aria-label="확대·이동 가능한 평면도"></svg>

      <div class="stage-top">
        <nav class="crumbs" id="crumbs" aria-label="현재 위치"></nav>
      </div>

      <div class="floorbar" id="floorbar" role="tablist" aria-label="층 선택"></div>

      <div class="map-tools">
        <button class="tool" id="zoomIn" type="button" title="확대" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" /></svg></button>
        <button class="tool" id="zoomOut" type="button" title="축소" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg></button>
        <button class="tool" id="zoomFit" type="button" title="전체 보기" aria-label="전체 보기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg></button>
        <button class="tool" id="toggleAux" type="button" title="치수·보조선 표시" aria-label="치수·보조선 표시" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 8h18M3 16h18M8 3v18M16 3v18" /></svg></button>
      </div>

      <div class="mode-banner" id="modeBanner" hidden>
        <span class="pulse" aria-hidden="true"></span>
        <span id="modeText">도면에서 위험한 곳을 눌러 위치를 찍어주세요</span>
        <button class="btn btn-ghost-light" id="modeCancel" type="button">취소</button>
      </div>

      <div class="loading" id="loading" hidden>도면 불러오는 중…</div>
    </section>

    <aside class="panel" id="panel">
      <section class="ctx" id="ctx"></section>

      <section class="reports">
        <div class="reports-head">
          <h2>신고 현황</h2>
          <div class="stats" id="stats"></div>
        </div>
        <div class="filters">
          <div class="seg" id="scopeSeg" role="radiogroup" aria-label="범위">
            <button type="button" data-v="here" aria-pressed="true">이 도면</button>
            <button type="button" data-v="all">전체</button>
          </div>
          <div class="seg" id="statusSeg" role="radiogroup" aria-label="상태">
            <button type="button" data-v="open" aria-pressed="true">미처리</button>
            <button type="button" data-v="done">완료</button>
            <button type="button" data-v="any">모두</button>
          </div>
        </div>
        <ul class="report-list" id="reportList"></ul>
        <div class="panel-foot">
          <button class="link" id="btnExport" type="button">JSON 내보내기</button>
          <label class="link">JSON 가져오기<input id="fileImport" type="file" accept="application/json" hidden /></label>
        </div>
      </section>
    </aside>
  </main>

  <!-- 신고 작성 -->
  <dialog class="sheet" id="formDialog">
    <form id="reportForm" method="dialog">
      <header class="sheet-head">
        <div>
          <p class="eyebrow" id="formWhere">위치</p>
          <h2>위험 요소 신고</h2>
        </div>
        <button class="icon-btn" value="cancel" type="button" data-close aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      </header>
      <div class="sheet-body">
        <fieldset>
          <legend>어떤 문제인가요?</legend>
          <div class="chips" id="catChips"></div>
        </fieldset>
        <fieldset>
          <legend>위험 정도</legend>
          <div class="sev" id="sevChips"></div>
        </fieldset>
        <label class="field">
          <span>제목 <em>*</em></span>
          <input name="title" required maxlength="60" placeholder="예) 2층 계단 난간 흔들림" />
        </label>
        <label class="field">
          <span>정확한 장소</span>
          <input name="spot" maxlength="60" placeholder="예) 2-3반 앞 복도, 계단실 2" />
        </label>
        <label class="field">
          <span>자세한 내용</span>
          <textarea name="desc" rows="4" maxlength="1000" placeholder="언제부터, 얼마나 위험한지 적어주세요"></textarea>
        </label>
        <div class="field">
          <span>사진 (선택)</span>
          <label class="photo-drop" id="photoDrop">
            <input type="file" name="photo" accept="image/*" capture="environment" hidden />
            <img id="photoPreview" alt="" hidden />
            <span id="photoHint">사진 추가 · 촬영</span>
          </label>
        </div>
        <label class="field">
          <span>신고자 (선택)</span>
          <input name="reporter" maxlength="30" placeholder="비워두면 익명" />
        </label>
      </div>
      <footer class="sheet-foot">
        <button class="btn btn-quiet" type="button" data-close>취소</button>
        <button class="btn btn-danger" type="submit">신고 접수</button>
      </footer>
    </form>
  </dialog>

  <!-- 신고 상세 -->
  <dialog class="sheet" id="detailDialog">
    <div id="detailBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
